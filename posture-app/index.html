<!DOCTYPE html>
<html>
<head>
  <title>Posture Monitor</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <audio id = "chimeAudio" src="chime.mp3"></audio>
  <button id="enableSound">Enable Sound</button>


  <div class="header">
    <img src="align.png" alt="Align logo" class="logo">
  </div>

  <div class="card">
    <h1>Posture Monitor</h1>
    <div id="status" class="good">Good Posture</div>
    <!-- <p id="angle">Angle: --</p> -->


  </div>

  <div class = "chart-container">
    <canvas id="postureChart" width="300" height="200"></canvas>
  </div>

  <button id="endSessionBtn">End Session</button>




  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="script.js"></script>
</body>
</html>
